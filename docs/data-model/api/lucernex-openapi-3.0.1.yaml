          type: integer
          description: "If triggerType is Delayed, then this specifies how long before\
            \ starting"
          format: int32
          xml:
            attribute: true
        cronExpression:
          type: string
          description: "If triggerType is Cron, then this specifies the cron scheduling\
            \ expression"
          xml:
            attribute: true
        state:
          type: string
          description: Task state
          xml:
            attribute: true
          enum:
          - Waiting
          - Executing
          - Canceled
          - Finished
          - Failed
        totalRecordCount:
          type: integer
          description: Total count of records to process
          format: int32
