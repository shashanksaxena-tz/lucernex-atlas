  /vendor-lease/{vendorId}/import:
    post:
      tags:
      - /vendor-lease
      summary: Import a lease abstract from a vendor-specific JSON payload
      description: Transforms the vendor JSON through the registered adapter and persists
        the canonical result via the BusinessObject pipeline. The caller's firmID
        is used for firm-specific adapter config overrides. When dryRun=true the payload
        is validated only — nothing is persisted.
      operationId: importVendorLease
      parameters:
      - name: vendorId
        in: path
        description: "Registered adapter vendor ID (e.g. inhouse, atlas)"
        required: true
        schema:
          type: string
      - name: allowUpdate
        in: query
        description: Update existing records matched by clientID/lxID; default false
        schema:
          type: boolean
          default: false
      - name: dryRun
        in: query
        description: Validate only — nothing is persisted; default false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: "Success: { importSuccesses: [...], importErrors: [...] };\
            \ or for dryRun: { valid: boolean, findings: [...] }"
        "400":
          description: Invalid vendorId or empty request body
        "401":
          description: Not authenticated
        "404":
          description: No adapter registered for the given vendorId
        "422":
          description: Adapter transform failed — vendor JSON did not map cleanly
