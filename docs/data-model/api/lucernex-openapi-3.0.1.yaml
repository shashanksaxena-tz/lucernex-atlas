        "400":
          description: Invalid virtual record type
        "500":
          description: Internal server error
components:
  schemas:
    BusinessObjectLink:
      type: object
      properties:
        lxID:
          type: integer
          description: Lucernex primary key
          format: int32
          xml:
            attribute: true
        objectType:
          type: string
          description: Record type
          xml:
            attribute: true
        name:
          type: string
          description: Unique name if the record is a project entity
          xml:
            attribute: true
        href:
          type: string
          description: REST URL which returns details of this record
          xml:
            attribute: true
      description: List of BusinessObjectLink instances
      xml:
        name: businessObjectLink
    BusinessObjectLinks:
      type: object
      properties:
        businessObjectLinks:
          type: array
          description: List of BusinessObjectLink instances
          xml:
            name: businessObjectLink
          items:
            $ref: "#/components/schemas/BusinessObjectLink"
      xml:
        name: businessObjectLinks
    AuditInfo:
      type: object
      properties:
        createdBy:
          type: string
        createdDate:
          type: string
          format: date-time
        action:
          type: string
          enum:
          - Add
          - Update
          - Delete
        entityName:
          type: string
        entityID:
          type: integer
          format: int32
        tableName:
          type: string
        fieldName:
          type: string
        oldValue:
          type: string
        newValue:
          type: string
        udf:
          type: boolean
      xml:
        name: AuditInfo
    ExtResponse:
      type: object
      properties:
        success:
          type: boolean
          xml:
            attribute: true
        message:
          type: string
          xml:
            attribute: true
        data:
          type: object
      description: Generic response wrapper
      xml:
        name: ext_response
    ImportError:
      title: error
      type: object
      properties:
        objectType:
          type: string
          xml:
            attribute: true
        clientID:
          type: string
          xml:
            attribute: true
        lxID:
          type: string
          xml:
            attribute: true
        entityUniqueID:
          type: string
          xml:
            attribute: true
        projectEntityID:
          type: string
          xml:
            attribute: true
        entityName:
          type: string
          xml:
            attribute: true
        lookup:
          type: boolean
          xml:
            attribute: true
        fatal:
          type: boolean
          xml:
            attribute: true
        message:
          type: string
        position:
          type: integer
          format: int32
      description: Failed persistence operation
      xml:
        name: error
    ImportResults:
      title: results
      type: object
      properties:
        successes:
          type: array
          xml:
            name: success
          items:
            $ref: "#/components/schemas/ImportSuccess"
        errors:
          type: array
          xml:
            name: error
          items:
            $ref: "#/components/schemas/ImportError"
      description: Results of persistence operation
      xml:
        name: results
    ImportSuccess:
      title: success
      type: object
      properties:
        objectType:
          type: string
          xml:
            attribute: true
        clientID:
          type: string
          xml:
            attribute: true
        lxID:
          type: string
          xml:
            attribute: true
        entityUniqueID:
          type: string
          xml:
            attribute: true
        projectEntityID:
          type: string
          xml:
            attribute: true
        entityName:
          type: string
          xml:
            attribute: true
        create:
          type: boolean
          xml:
            attribute: true
        delete:
          type: boolean
          xml:
            attribute: true
        update:
          type: boolean
          xml:
            attribute: true
      description: Successful persistence operation
