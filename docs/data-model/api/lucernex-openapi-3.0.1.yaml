openapi: 3.0.1
info:
  title: Lucernex API
  description: Lucernex Restfull API
  version: 1.0.0
servers:
- url: https://train-bbw.lucernex.com/rest
tags:
- name: /adapter-config
  description: "Admin: manage lease-abstraction adapter mapping config files"
- name: /atlas-api
  description: Fetch and import lease records from the Atlas (RocketClub) API
- name: /audit
  description: Audit trail queries
- name: /businessObject
  description: BusinessObject operations
- name: /firm
  description: Bulk record imports
- name: /i18n
  description: i18n resource bundle
- name: /membership
  description: membership resource bundle
- name: /task
  description: Task operations
- name: /tasks
  description: Tasks operations
- name: /vendor-lease
  description: Import vendor-abstracted lease data via the adapter transformation
    pipeline
- name: "/workFlowStep/{WorkFlowStepID}"
  description: WorkFlowStep operations
paths:
  /adapter-config/{vendorId}/{fileName}:
    get:
      tags:
      - /adapter-config
      summary: Download the effective config file for a vendor entity
      description: Returns the JSON content of the effective config file. External
        filesystem override is served if present; otherwise the classpath default
        is returned. Requires PS/LX admin.
      operationId: getConfigFile
      parameters:
      - name: vendorId
        in: path
        description: "Vendor ID (e.g. atlas, inhouse)"
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: Config file name (e.g. facility.json)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: JSON config file content
        "400":
          description: Invalid vendorId or fileName
        "403":
          description: Insufficient privileges
        "404":
          description: Config file not found
    put:
      tags:
      - /adapter-config
      summary: Upload an external override for a vendor config file
      description: "Saves the request body as an external filesystem override, which\
        \ takes precedence over the classpath default on the next import without requiring\
        \ a WAR redeployment. The body must be valid JSON. Requires PS/LX admin."
      operationId: putConfigFile
      parameters:
      - name: vendorId
        in: path
        description: "Vendor ID (e.g. atlas, inhouse)"
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: Config file name (e.g. facility.json)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: Config file saved
        "400":
          description: "Invalid JSON, vendorId, or fileName"
        "403":
          description: Insufficient privileges
        "409":
          description: No external config directory configured (set iwms.adapter.config.dir
            or LxConfigDir)
    delete:
      tags:
      - /adapter-config
      summary: "Remove an external config override, reverting to the classpath default"
      description: Deletes the external filesystem override for the specified file.
        After deletion the classpath default bundled in the WAR is used again. Requires
        PS/LX admin.
      operationId: deleteConfigFile
      parameters:
      - name: vendorId
        in: path
        description: "Vendor ID (e.g. atlas, inhouse)"
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: Config file name (e.g. facility.json)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: External override deleted
        "400":
          description: Invalid vendorId or fileName
        "403":
          description: Insufficient privileges
        "404":
          description: No external override exists for this file
  /adapter-config/firms/{firmId}/{vendorId}/{fileName}:
    get:
      tags:
      - /adapter-config
      summary: Download the effective firm-specific config file
      description: Returns the JSON content of the config file resolved for the given
        tenant. Firm-specific external override is served first; then common external;
        then classpath default. X-Config-Source header indicates which tier was used.
        Requires PS/LX admin.
      operationId: getFirmConfigFile
      parameters:
      - name: firmId
        in: path
        description: Firm ID (positive integer)
        required: true
        schema:
          type: string
      - name: vendorId
        in: path
        description: "Vendor ID (e.g. atlas, inhouse)"
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: Config file name (e.g. facility.json)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: JSON config file content
        "400":
          description: "Invalid firmId, vendorId, or fileName"
        "403":
          description: Insufficient privileges
        "404":
          description: Config file not found
    put:
      tags:
      - /adapter-config
      summary: Upload a firm-specific config override
      description: Saves the request body as a firm-specific external filesystem override
        that takes precedence over both the common external override and the classpath
        default for the given tenant. The body must be valid JSON. Requires PS/LX
        admin.
      operationId: putFirmConfigFile
      parameters:
      - name: firmId
        in: path
        description: Firm ID (positive integer)
        required: true
        schema:
          type: string
      - name: vendorId
        in: path
        description: "Vendor ID (e.g. atlas, inhouse)"
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: Config file name (e.g. facility.json)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: Firm config file saved
        "400":
          description: "Invalid JSON, firmId, vendorId, or fileName"
        "403":
          description: Insufficient privileges
        "409":
          description: No external config directory configured
    delete:
      tags:
      - /adapter-config
      summary: Remove a firm-specific config override
      description: Deletes the firm-specific external filesystem override for the
        specified file. After deletion the common external override (if present) or
        the classpath default is used for this tenant. Requires PS/LX admin.
      operationId: deleteFirmConfigFile
      parameters:
      - name: firmId
        in: path
        description: Firm ID (positive integer)
        required: true
        schema:
          type: string
      - name: vendorId
        in: path
        description: "Vendor ID (e.g. atlas, inhouse)"
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: Config file name (e.g. facility.json)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Firm override deleted
        "400":
          description: "Invalid firmId, vendorId, or fileName"
        "403":
          description: Insufficient privileges
        "404":
          description: No firm override exists for this file
  /adapter-config/{vendorId}/files:
    get:
      tags:
      - /adapter-config
      summary: List config files for a vendor
      description: "Returns metadata for each expected config file, indicating whether\
        \ an external filesystem override is active or the classpath default is in\
        \ use. Requires PS/LX admin."
      operationId: listFiles
      parameters:
      - name: vendorId
        in: path
        description: "Vendor ID (e.g. atlas, inhouse)"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Array of file-metadata objects
        "400":
          description: Invalid vendorId
        "403":
          description: Insufficient privileges
        "404":
          description: Vendor not registered
  /adapter-config/firms/{firmId}/{vendorId}/files:
    get:
      tags:
      - /adapter-config
      summary: List firm-specific config files for a vendor
      description: "Returns metadata for each expected config file, indicating whether\
        \ a firm-specific external override, a common external override, or the classpath\
        \ default is in use for the given tenant. Requires PS/LX admin."
      operationId: listFirmFiles
      parameters:
      - name: firmId
        in: path
        description: Firm ID (positive integer)
        required: true
        schema:
          type: string
      - name: vendorId
        in: path
        description: "Vendor ID (e.g. atlas, inhouse)"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Array of file-metadata objects
        "400":
          description: Invalid firmId or vendorId
        "403":
          description: Insufficient privileges
        "404":
          description: Vendor not registered
  /adapter-config/vendors:
    get:
      tags:
      - /adapter-config
      summary: List registered vendor adapter IDs
      description: "Returns the vendor IDs of all adapters registered at startup (e.g.\
        \ \"atlas\", \"inhouse\"). Requires PS/LX admin."
      operationId: listVendors
      responses:
        "200":
          description: Array of vendor ID strings
          content:
            application/json:
              schema:
                type: array
                example:
                - atlas
                - inhouse
        "403":
          description: Insufficient privileges
  /atlas-api/import/{leaseId}:
    post:
      tags:
      - /atlas-api
      summary: Fetch a single lease from the Atlas API and import it into iWMS
      description: "Fetches one lease by its Atlas ID, transforms it, and persists\
        \ it."
      operationId: importOne
      parameters:
      - name: Authorization
        in: header
        description: Bearer <token> for the LX-IWMS API
        required: true
        schema:
          type: string
      - name: leaseId
        in: path
        description: Atlas lease integer ID
        required: true
        schema:
          type: integer
          format: int64
      - name: allowUpdate
        in: query
        schema:
          type: boolean
          default: true
      - name: dryRun
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: "{ imported: 1, failed: 0, results: [...] }"
        "400":
          description: Missing or invalid Authorization header
        "401":
          description: Not authenticated to iWMS
        "502":
          description: Atlas API call failed
  /atlas-api/import/{leaseId}/async:
    post:
      tags:
      - /atlas-api
      summary: Schedule asynchronous Atlas lease import
      description: "Queues a background task that fetches, transforms, and persists\
        \ one Atlas lease."
      operationId: importOneAsync
      parameters:
      - name: Authorization
        in: header
        description: Bearer <token> for the LX-IWMS API
        schema:
          type: string
      - name: leaseId
        in: path
        description: Atlas lease integer ID
        required: true
        schema:
          type: integer
          format: int64
      - name: createNew
        in: query
        schema:
          type: boolean
          default: true
      - name: persist
        in: query
        schema:
          type: boolean
          default: true
      - name: existingContractLxID
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Task scheduled
        "400":
          description: Invalid request
        "401":
          description: Not authenticated
  /atlas-api/contracts:
    get:
      tags:
      - /atlas-api
      summary: List active contracts for Atlas update-existing import
      description: Returns active contracts visible to the current user for selecting
        an existing contract during Atlas lease import.
      operationId: listContracts
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: start
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      - name: filter
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Accessible contract list
        "401":
          description: Not authenticated to iWMS
        "403":
          description: AI Lease Abstraction access not granted
  /atlas-api/leases:
    get:
      tags:
      - /atlas-api
      summary: List all leases from the Atlas API
      description: Proxies the Atlas lease list endpoint and returns the raw JSON
        for display in the Your Leases grid. Requires AI Lease Abstraction access.
      operationId: listLeases
      responses:
        "200":
          description: Raw Atlas API lease list
        "401":
          description: Not authenticated to iWMS
        "403":
          description: AI Lease Abstraction access not granted
        "502":
          description: Atlas API call failed
  /atlas-api/import/events/{taskName}:
    get:
      tags:
      - /atlas-api
      summary: Stream Atlas import progress events
      description: SSE stream for Atlas lease import task updates.
      operationId: streamImportEvents
      parameters:
      - name: taskName
        in: path
        description: Task name returned from async start endpoint
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            text/event-stream: {}
  /atlas-api/sync:
    post:
      tags:
      - /atlas-api
      summary: Fetch all leases from the Atlas API and import them into iWMS
      description: "Calls the Atlas Lease Abstraction API, transforms each lease through\
        \ the adapter pipeline, and persists the result. Requires an Atlas API bearer\
        \ token in the Authorization header."
      operationId: syncAll
      parameters:
      - name: Authorization
        in: header
        description: Bearer <token> for the LX-IWMS API
        required: true
        schema:
          type: string
      - name: allowUpdate
        in: query
        schema:
          type: boolean
          default: false
      - name: dryRun
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: "{ imported: int, failed: int, results: [...] }"
        "400":
          description: Missing or invalid Authorization header
        "401":
          description: Not authenticated to iWMS
        "502":
          description: Atlas API call failed
  /audit/auditInfo:
    get:
      tags:
      - /audit
      summary: Fetch audit information
      operationId: fetchAuditInfo
      parameters:
      - name: loginName
        in: query
        schema:
          type: string
      - name: tableName
        in: query
        schema:
          type: string
      - name: objectID
        in: query
        schema:
          type: integer
          format: int32
      - name: projectEntityID
        in: query
        schema:
          type: integer
          format: int32
      - name: beginDate
        in: query
        schema:
          type: string
      - name: endDate
        in: query
        schema:
          type: string
      - name: accessorName
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Audit information retrieved successfully
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/AuditInfo"
            application/json:
              schema:
                $ref: "#/components/schemas/AuditInfo"
        "404":
          description: ProjectEntity not found
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ExtResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtResponse"
        "500":
          description: Internal server error
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ExtResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtResponse"
  /audit/{maxAuditTableID}:
    get:
      tags:
      - /audit
      summary: Query table audit trail
      operationId: fetchChanges
      parameters:
      - name: maxAuditTableID
        in: path
        description: AuditTable max ID
        required: true
        schema:
          type: integer
          format: int64
      - name: sortAsc
        in: query
        description: Sort by time of change in ascending order
        schema:
          type: boolean
          default: true
      - name: synchronous
        in: query
        description: Execute query synchronous or via Quartz job
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: Audit trail report
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Specified maxAuditTableID not found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtResponse"
  /audit:
    get:
      tags:
      - /audit
      summary: Query table audit trail
      operationId: fetchFieldChanges
      parameters:
      - name: objectType
        in: query
        description: Record type
        required: true
        schema:
          type: string
      - name: lxID
        in: query
        description: Primary Key
        required: true
        schema:
          type: integer
          format: int32
      - name: lastModified
        in: query
        description: Last modified timestamp
        schema:
          type: string
      responses:
        "200":
          description: Audit trail report
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtResponse"
  /audit/maxAuditTableID:
    get:
      tags:
      - /audit
      summary: Query max(AuditTableID)
      operationId: fetchMaxAuditTrailID
      responses:
        "200":
          description: Value of max(AuditTableID)
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtResponse"
  /audit/{peid}/{lastModified}:
    get:
      tags:
      - /audit
      summary: Query audit table for record groups and types that changed for an identified
        ProjectEntity
      operationId: fetchProjectEntityChangedRecords
      parameters:
      - name: peid
        in: path
        description: ProjectEntity ID
        required: true
        schema:
          type: integer
          format: int32
      - name: lastModified
        in: path
        description: Last modified timestamp n ISO 8601 format
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Audit trail report
          content:
            application/json:
              schema:
                type: string
        "404":
          description: ProjectEntity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtResponse"
  /boList:
    get:
      operationId: fetchRecords
      parameters:
      - name: showUpdateAssignment
        in: query
        schema:
          type: boolean
          default: true
      - name: projectEntityID
        in: query
        schema:
          type: integer
          format: int32
          default: -1
      - name: inPanel
        in: query
        schema:
          type: boolean
          default: true
      - name: ajaxList
        in: query
        schema:
          type: boolean
          default: true
      - name: ajax
        in: query
        schema:
          type: boolean
          default: true
      - name: popupList
        in: query
        schema:
          type: boolean
          default: true
      - name: fdName
        in: query
        schema:
          type: string
          default: ""
      - name: searchTextKey
        in: query
        schema:
          type: string
          default: ""
      - name: BOType
        in: query
        schema:
          type: string
          default: ""
      - name: volumnSearchText
        in: query
        schema:
          type: string
          default: ""
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: start
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        schema:
          type: string
          default: ""
      - name: sort
        in: query
        schema:
          type: string
          default: ""
      responses:
        default:
          description: default response
          content:
            application/json: {}
    post:
      operationId: addAllMembers
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fdName:
                  type: string
                searchTextkey:
                  type: string
                volumnSearchText:
                  type: string
                filter:
                  type: string
                BOType:
                  type: string
                start:
                  type: string
                limit:
                  type: string
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /budgetViewAssignments/{budgetViewID}:
    get:
      operationId: getBudgetViewAssignments
      parameters:
      - name: budgetViewID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        schema:
          type: string
      - name: start
        in: query
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /businessObject/{objectType}:
    get:
      tags:
      - /businessObject
      summary: Find set of BusinessObjectLinks
      description: Find set of BusinessObjectLinks of the specified record type
      operationId: fetchBusinessObjectLinks
      parameters:
      - name: maxAuditTableID
        in: query
        description: AuditTable ID
        schema:
          type: integer
          format: int64
      - name: lastModifiedValue
        in: query
        description: Last modified timestamp in ISO 8601 format
        schema:
          type: string
      - name: fields
        in: query
        description: "Comma separated field names (href, lxid, name, objecttype)"
        schema:
          type: string
      - name: datamart
        in: query
        description: Is query from datamart?
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Found record(s)
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/BusinessObjectLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessObjectLinks"
        "500":
          description: Internal server error
    put:
      tags:
      - /businessObject
      summary: "Updates {objectType} record"
      operationId: update
      requestBody:
        description: Record to update
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/BusinessObject"
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessObject"
        required: true
      responses:
        "200":
          description: Record updated
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ImportResults"
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResults"
        "404":
          description: Record not found
        "500":
          description: Internal server error
    post:
      tags:
      - /businessObject
      summary: "Creates/Updates {objectType} record"
      operationId: create
      parameters:
      - name: allowUpdate
        in: query
        description: Allow update of existing record
        schema:
          type: boolean
          default: false
      requestBody:
        description: Record to create
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/BusinessObject"
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessObject"
        required: true
      responses:
        "200":
          description: Created/updated record
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ImportResults"
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResults"
        "400":
          description: Bad request
        "500":
          description: Internal server error
  /businessObject/{parentObjectType}/{parentID}:
    post:
      tags:
      - /businessObject
      operationId: createChild
      parameters:
      - name: parentObjectType
        in: path
        required: true
        schema:
          type: string
      - name: parentID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/BusinessObject"
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessObject"
      responses:
        default:
          description: default response
          content:
            application/xml: {}
            application/json: {}
  /businessObject/{objectType}/clientid/{clientID}:
    get:
      tags:
      - /businessObject
      summary: "Find {objectType} record by clientID"
      description: "Finds the {objectType} record identified by the specified client\
        \ defined identifier string"
      operationId: findByClientID
      parameters:
      - name: clientID
        in: path
        description: Unique client ID
        required: true
        schema:
          type: string
      - name: deep
        in: query
        description: Deep/shallow serialization
        schema:
          type: boolean
          default: false
      - name: wantClientID
        in: query
        description: Want clientID attribute
        schema:
          type: boolean
          default: true
      - name: wantLxID
        in: query
        description: Want lxID attribute
        schema:
          type: boolean
          default: false
      - name: includes
        in: query
        description: Includes pattern
        schema:
          type: string
