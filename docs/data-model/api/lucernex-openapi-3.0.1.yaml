          description: Raw JSON payload from Atlas API
        transformedJson:
          type: string
          description: Transformed canonical JSON after processing
        importCounts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ImportCounts"
        percentProcessed:
          type: integer
          format: int32
          xml:
            attribute: true
        runAsDifferentUser:
          type: boolean
        criticalImportBusinessHoursAlertSent:
          type: boolean
