          type: string
          description: Classname of job which implements this task
          xml:
            attribute: true
        jobArgument:
          type: string
          description: Job execution argument which can be most anything
        options:
          $ref: "#/components/schemas/Options"
        encodedObject:
          type: string
          description: Optional encoded object to process.
          xml:
            name: object
        inputFile:
          type: string
          description: Input file to process if there is one
          xml:
            attribute: true
        inputFormat:
          type: string
          description: Input file format
          xml:
            attribute: true
          enum:
          - "xml,xls"
        outputFile:
          type: string
          description: Generated output file if there is one
          xml:
            attribute: true
        runTime:
          type: integer
          description: Number of milliseconds task ran before finishing
          format: int64
          xml:
            attribute: true
        successCount:
          type: integer
          description: Number of successes encountered executing job
          format: int32
        warningCount:
          type: integer
          description: Number of warnings encountered executing job
          format: int32
        errorCount:
          type: integer
          description: Number of errors encountered executing job
          format: int32
